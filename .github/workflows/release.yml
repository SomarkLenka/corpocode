# Release — driven entirely by Conventional Commit messages, so a human never picks a version number
# or writes a changelog by hand. On a push to main, the full verify suite runs first (the release is
# gated on it), then semantic-release reads the merged commits, computes the semver bump, generates the
# release notes, publishes to npm WITH provenance, and tags the commit. Nothing here runs on a plain
# `npm install` — activation is always the user's explicit `corpocode install`.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write # create tags + GitHub releases
  issues: write
  pull-requests: write
  id-token: write # OIDC for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history to analyze commits
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run verify # the release gate: never publish something that does not build/typecheck/test
      - run: npx --yes semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
