<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CorpoCode Monitor</title>
    <style>
      :root {
        --bg: #0d1017;
        --panel: #141925;
        --panel-2: #1b2230;
        --line: #232c3d;
        --fg: #d7dde8;
        --muted: #8a94a6;
        --accent: #5cc8ff;
        --ok: #6ee7a8;
        --warn: #ffce6e;
        --err: #ff7a85;
        --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 var(--mono);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        flex-wrap: wrap;
      }
      header .brand { font-weight: 700; letter-spacing: 0.3px; }
      header .brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
      .spacer { flex: 1; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
      .dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
      .dot.down { background: var(--err); }
      .tabs { display: flex; gap: 4px; }
      .tab {
        background: var(--panel-2);
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
      }
      .tab.active { color: var(--fg); border-color: var(--accent); }
      select, .toggle {
        background: var(--panel-2);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 8px;
        font: inherit;
      }
      .toggle { cursor: pointer; }
      .toggle.off { color: var(--muted); }
      main { flex: 1; overflow: hidden; position: relative; }
      .view { position: absolute; inset: 0; overflow-y: auto; padding: 12px 14px; display: none; }
      .view.active { display: block; }
      .empty {
        color: var(--muted);
        text-align: center;
        margin-top: 18vh;
        font-size: 15px;
      }
      .empty .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

      /* Flow blocks */
      .block {
        border: 1px solid var(--line);
        border-left: 3px solid var(--hook, var(--accent));
        border-radius: 8px;
        background: var(--panel);
        margin-bottom: 10px;
        overflow: hidden;
      }
      .block > .bh {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 8px 12px;
        background: var(--panel-2);
        cursor: pointer;
        flex-wrap: wrap;
      }
      .block .hook { color: var(--hook, var(--accent)); font-weight: 700; }
      .block .detail { color: var(--fg); opacity: 0.85; }
      .block .meta { color: var(--muted); font-size: 12px; }
      .block .sess { color: var(--muted); font-size: 12px; }
      .block pre {
        margin: 0;
        padding: 10px 12px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        color: var(--fg);
        border-top: 1px solid var(--line);
      }
      .block.collapsed pre { display: none; }

      /* Event rows */
      table { width: 100%; border-collapse: collapse; }
      td { padding: 3px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
      td.ts { color: var(--muted); white-space: nowrap; font-size: 12px; }
      td.ev { color: var(--accent); white-space: nowrap; }
      td.comp { color: var(--ok); white-space: nowrap; }
      td.rest { color: var(--fg); opacity: 0.85; word-break: break-all; }
      tr.err td.ev { color: var(--err); }

      .pausebar {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent);
        color: #04222f;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 20px;
        cursor: pointer;
        display: none;
        box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      }
      .pausebar.show { display: block; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">CorpoCode <small>monitor</small></span>
      <span id="status" class="dot" title="connecting…"></span>
      <div class="spacer"></div>
      <label class="meta" style="color:var(--muted)">session
        <select id="session"><option value="">all</option></select>
      </label>
      <button id="autobtn" class="toggle" title="toggle auto-scroll">auto-scroll ●</button>
      <div class="tabs">
        <button class="tab active" data-view="flow">Flow</button>
        <button class="tab" data-view="events">Events</button>
      </div>
    </header>
    <main>
      <section id="flow" class="view active">
        <div class="empty" id="flow-empty"><span class="pulse">waiting for activity…</span></div>
      </section>
      <section id="events" class="view">
        <div class="empty" id="events-empty"><span class="pulse">waiting for events…</span></div>
        <table id="events-table" style="display:none"><tbody></tbody></table>
      </section>
      <button id="pausebar" class="pausebar">▼ new activity — jump to latest</button>
    </main>

    <script>
      // Deterministic hue per hook name so each hook keeps a stable colour across the session.
      function hookColor(name) {
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
        return `hsl(${h} 70% 66%)`;
      }
      function short(id) { return id ? (id.length > 8 ? id.slice(0, 8) : id) : "—"; }

      const els = {
        status: document.getElementById("status"),
        session: document.getElementById("session"),
        autobtn: document.getElementById("autobtn"),
        flow: document.getElementById("flow"),
        events: document.getElementById("events"),
        flowEmpty: document.getElementById("flow-empty"),
        eventsEmpty: document.getElementById("events-empty"),
        eventsTable: document.getElementById("events-table"),
        eventsBody: document.querySelector("#events-table tbody"),
        pausebar: document.getElementById("pausebar"),
      };

      let autoScroll = true;
      const knownSessions = new Set();
      let currentView = "flow";

      // Tabs
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
          document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
          tab.classList.add("active");
          currentView = tab.dataset.view;
          document.getElementById(currentView).classList.add("active");
          applyFilter();
          if (autoScroll) scrollActive();
        });
      });

      // Auto-scroll toggle + pause-on-scroll-up
      els.autobtn.addEventListener("click", () => setAuto(!autoScroll));
      function setAuto(on) {
        autoScroll = on;
        els.autobtn.classList.toggle("off", !on);
        els.autobtn.textContent = on ? "auto-scroll ●" : "auto-scroll ○";
        els.pausebar.classList.toggle("show", !on);
        if (on) scrollActive();
      }
      function activeView() { return currentView === "flow" ? els.flow : els.events; }
      function scrollActive() { const v = activeView(); v.scrollTop = v.scrollHeight; }
      function nearBottom(v) { return v.scrollHeight - v.scrollTop - v.clientHeight < 40; }
      [els.flow, els.events].forEach((v) => {
        v.addEventListener("scroll", () => {
          if (v !== activeView()) return;
          if (nearBottom(v)) { if (!autoScroll) setAuto(true); }
          else if (autoScroll) setAuto(false);
        });
      });
      els.pausebar.addEventListener("click", () => setAuto(true));

      els.session.addEventListener("change", () => { applyFilter(); if (autoScroll) scrollActive(); });
      function currentSession() { return els.session.value; }
      function registerSession(id) {
        if (!id || knownSessions.has(id)) return;
        knownSessions.add(id);
        const opt = document.createElement("option");
        opt.value = id; opt.textContent = short(id);
        els.session.appendChild(opt);
      }
      function applyFilter() {
        const sel = currentSession();
        document.querySelectorAll("#flow .block").forEach((b) => {
          b.style.display = !sel || b.dataset.session === sel ? "" : "none";
        });
        document.querySelectorAll("#events tbody tr").forEach((r) => {
          r.style.display = !sel || r.dataset.session === sel ? "" : "none";
        });
      }

      function addFlow(b) {
        els.flowEmpty.style.display = "none";
        registerSession(b.sessionId);
        const color = hookColor(b.hookName || "hook");
        const div = document.createElement("div");
        div.className = "block";
        div.dataset.session = b.sessionId || "";
        div.style.setProperty("--hook", color);
        const head = document.createElement("div");
        head.className = "bh";
        head.innerHTML =
          `<span class="hook"></span>` +
          (b.detail ? `<span class="detail"></span>` : "") +
          `<span class="spacer"></span>` +
          `<span class="meta"></span>` +
          `<span class="sess">session ${short(b.sessionId)}</span>`;
        head.querySelector(".hook").textContent = "▶ " + (b.hookName || "hook");
        if (b.detail) head.querySelector(".detail").textContent = b.detail;
        head.querySelector(".meta").textContent = b.ts || "";
        const pre = document.createElement("pre");
        pre.textContent = b.text || "";
        head.addEventListener("click", () => div.classList.toggle("collapsed"));
        div.append(head, pre);
        const sel = currentSession();
        if (sel && div.dataset.session !== sel) div.style.display = "none";
        els.flow.appendChild(div);
      }

      function addEvent(e) {
        els.eventsEmpty.style.display = "none";
        els.eventsTable.style.display = "";
        const tr = document.createElement("tr");
        tr.dataset.session = e.session_id || "";
        if (e.event === "hook_error" || e.error) tr.className = "err";
        const { ts, event, component, session_id, ...rest } = e;
        tr.innerHTML = `<td class="ts"></td><td class="ev"></td><td class="comp"></td><td class="rest"></td>`;
        const cells = tr.children;
        cells[0].textContent = (ts || "").replace("T", " ").replace("Z", "");
        cells[1].textContent = event || (e.raw ? "raw" : "");
        cells[2].textContent = component || "";
        cells[3].textContent = e.raw !== undefined ? String(e.raw) : Object.keys(rest).length ? JSON.stringify(rest) : "";
        const sel = currentSession();
        if (sel && tr.dataset.session !== sel) tr.style.display = "none";
        els.eventsBody.appendChild(tr);
      }

      function connect() {
        const src = new EventSource("/stream");
        src.addEventListener("open", () => { els.status.className = "dot live"; els.status.title = "live"; });
        src.addEventListener("error", () => { els.status.className = "dot down"; els.status.title = "disconnected — retrying"; });
        src.addEventListener("ready", () => { if (autoScroll) scrollActive(); });
        src.addEventListener("flow", (ev) => {
          addFlow(JSON.parse(ev.data));
          if (autoScroll && currentView === "flow") scrollActive();
          else if (currentView === "flow") els.pausebar.classList.add("show");
        });
        src.addEventListener("event", (ev) => {
          addEvent(JSON.parse(ev.data));
          if (autoScroll && currentView === "events") scrollActive();
          else if (currentView === "events") els.pausebar.classList.add("show");
        });
      }
      connect();
    </script>
  </body>
</html>
